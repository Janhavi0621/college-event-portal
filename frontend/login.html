<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"><title>Log in · CampusEvents</title></head><body>
<div class="auth">
  <aside class="auth-side">
    <a class="logo" href="index.html"><span class="logo-mark"></span>CampusEvents</a>
    <div><h2>Your next event is one tap away.</h2>
      <ul><li>See live seat availability</li><li>Register in seconds</li><li>Keep every pass in one place</li></ul></div>
    <p class="muted" style="margin:0">Organizers can sign in here too.</p>
  </aside>
  <main class="auth-main"><div class="auth-card">
    <a class="logo" href="index.html" style="margin-bottom:2rem"><span class="logo-mark"></span>CampusEvents</a>
    <h1>Log in</h1><p class="muted">Welcome back. Enter your details to continue.</p>
    <form id="loginForm" novalidate>
      <div class="form-error" role="alert" hidden></div>
      <div class="field"><label>I am a</label>
        <div class="segmented">
          <input type="radio" name="role" id="roleStudent" value="student" checked><label for="roleStudent">Student</label>
          <input type="radio" name="role" id="roleOrg" value="organizer"><label for="roleOrg">Organizer</label>
        </div></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@college.edu"><p class="field-error"></p></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="pw-toggle" aria-label="Show or hide password">Show</button></div><p class="field-error"></p></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Login</button>
    </form>
    <div class="divider">New here?</div>
    <a class="btn btn-ghost btn-block" href="register.html">Create Account</a>
  </div></main>
</div>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body></html>
